apiVersion: v1
kind: ConfigMap
metadata:
  name: modularcommerce-mcp-config
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger.observability.svc.cluster.local:4317"
  # Host, cluster içinde kendi Service'i üzerinden (modularcommerce-api, port 80) çağrılır —
  # MCP de diğer her client gibi yalnız public HTTP API'ye gider, modül iç katmanına değil.
  ModularCommerceApi__BaseUrl: "http://modularcommerce-api"
