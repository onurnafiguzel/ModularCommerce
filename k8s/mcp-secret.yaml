apiVersion: v1
kind: Secret
metadata:
  name: modularcommerce-mcp-secrets
type: Opaque
stringData:
  # PLACEHOLDER — repoya gerçek değer ASLA girmez. Gerçek imzalama anahtarı CI'da
  # (GitHub Actions secret → `kubectl create secret ... --dry-run=client -o yaml | kubectl apply -f -`)
  # bu Secret'in ÜZERİNE yazılır (release.yml, bu dosyanın blanket `kubectl apply -f k8s/`'ından SONRA).
  # Host'un KENDİ Jwt:SigningKey'inden bilerek ayrı: MCP'nin bastığı token sahte Host token'ı
  # olarak kabul edilmesin (issuer<->key bağlı doğrulama, JwtAuthenticationExtensions).
  Jwt__Mcp__SigningKey: "REPLACE_IN_CI"
