name: Release

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Bootstrapper/ModularCommerce.Host/Dockerfile
          push: true
          tags: ghcr.io/onurnafiguzel/modularcommerce:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Bootstrapper/ModularCommerce.Mcp/Dockerfile
          push: true
          tags: ghcr.io/onurnafiguzel/modularcommerce-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push, build-and-push-mcp]
    if: vars.AKS_DEPLOY_ENABLED == 'true'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-modularcommerce
          cluster-name: aks-modularcommerce

      - name: Set image tag
        run: |
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g" k8s/deployment.yaml
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g" k8s/migration-job.yaml
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g" k8s/mcp-deployment.yaml

      - name: Deploy
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/modularcommerce-api --timeout=5m
          kubectl rollout status deployment/modularcommerce-mcp --timeout=5m

      # k8s/mcp-secret.yaml repoda SADECE placeholder tutar (bkz. dosyadaki not). Gerçek imzalama
      # anahtarı burada, blanket `kubectl apply -f k8s/`den SONRA, GERÇEK bir GitHub Actions secret'ından
      # enjekte edilir — bu adım placeholder'ı ÜZERİNE YAZAR, sıralama bilerek bu yönde (secret, repodaki
      # dosyadan sonra uygulanıyor ki placeholder asla son durum olmasın).
      - name: Inject real MCP secrets
        run: |
          kubectl create secret generic modularcommerce-mcp-secrets \
            --from-literal=Jwt__Mcp__SigningKey="${{ secrets.MCP_JWT_SIGNING_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl rollout restart deployment/modularcommerce-mcp
          kubectl rollout status deployment/modularcommerce-mcp --timeout=5m