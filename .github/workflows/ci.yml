# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      # "Stress" kategorisi (100-paralel, gerçek Testcontainers, yavaş + bilinen bir TTL-ile-
      # kendiliğinden-düzelen sızıntıya karşı gürültülü, bkz. FOLLOWUPS.md) burada hariç
      # tutulur; ayrı bir workflow'da (stress-tests.yml, haftalık + workflow_dispatch) çalışır.
      run: dotnet test --verbosity normal --filter "Category!=Stress"
